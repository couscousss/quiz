<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Albatross Files — Live Scoreboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f4ecd8;--paper2:#faf5e6;--ink:#23201a;--soft:#5b5443;--faint:#8a8168;--red:#b3121f;--line:#d8cba8;--gold:#c8a53a;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;
      background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px);}
    .wrap{max-width:820px;margin:0 auto;padding:22px 18px 40px;}
    .top{display:flex;align-items:center;gap:12px;border:2px solid var(--ink);border-radius:5px;background:var(--paper2);padding:14px 18px;}
    .top .k{font-family:"Special Elite",monospace;font-size:.66rem;letter-spacing:.1em;color:var(--soft);}
    .top h1{font-family:Fraunces,serif;font-weight:900;font-size:1.5rem;margin:2px 0 0;letter-spacing:-.01em;}
    .live{margin-left:auto;font-family:"Special Elite",monospace;font-size:.72rem;letter-spacing:.08em;color:var(--red);display:flex;align-items:center;gap:7px;white-space:nowrap;}
    .live .dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:p 1.6s infinite;}
    @keyframes p{0%,100%{opacity:.3;}50%{opacity:1;}}
    .meta{font-family:"Special Elite",monospace;font-size:.72rem;letter-spacing:.06em;color:var(--faint);margin:14px 2px 10px;text-transform:uppercase;display:flex;justify-content:space-between;}
    table{width:100%;border-collapse:collapse;}
    th{font-family:"Special Elite",monospace;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);}
    th.r,td.r{text-align:right;font-variant-numeric:tabular-nums;}
    td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:1rem;}
    tr td:first-child{font-family:Fraunces,serif;font-weight:900;font-size:1.15rem;width:54px;}
    .nm{font-weight:600;}
    .cl{color:var(--soft);font-size:.85rem;}
    .sc{font-family:Fraunces,serif;font-weight:900;font-size:1.2rem;color:var(--red);}
    .tm{color:var(--soft);font-variant-numeric:tabular-nums;}
    tr.top1 td{background:color-mix(in srgb,var(--gold) 20%,transparent);}
    tr.top2 td{background:color-mix(in srgb,var(--faint) 14%,transparent);}
    tr.top3 td{background:color-mix(in srgb,var(--red) 9%,transparent);}
    .empty{text-align:center;color:var(--soft);padding:50px 20px;font-family:Fraunces,serif;font-size:1.2rem;}
    .err{text-align:center;color:var(--red);padding:40px;}
    /* ---- manage entries ---- */
    .tools{display:flex;gap:10px;align-items:center;margin:26px 2px 10px;flex-wrap:wrap;}
    .btn{font-family:Inter,system-ui,sans-serif;font-size:.85rem;font-weight:600;padding:9px 14px;border-radius:4px;
      border:1.5px solid var(--line);background:var(--paper2);color:var(--ink);cursor:pointer;min-height:40px;}
    .btn:hover{border-color:var(--faint);}
    .btn.danger{border-color:var(--red);color:var(--red);}
    .btn.danger:hover{background:var(--red);color:#fff;}
    .btn[disabled]{opacity:.5;cursor:not-allowed;}
    .del{border:1px solid var(--line);background:transparent;color:var(--red);border-radius:4px;
      padding:5px 10px;font-size:.78rem;cursor:pointer;font-family:Inter,system-ui,sans-serif;min-height:32px;}
    .del:hover{background:var(--red);color:#fff;border-color:var(--red);}
    .ph{color:var(--faint);font-size:.8rem;font-variant-numeric:tabular-nums;}
    .note{font-size:.8rem;color:var(--soft);margin:0 2px 10px;}
    .flash{margin:10px 2px;padding:10px 12px;border-radius:4px;font-size:.85rem;
      border:1px solid var(--line);background:var(--paper2);}
    .flash.bad{border-color:var(--red);color:var(--red);}
    #manage{display:none;}
    #manage.on{display:block;}
    @media (max-width:520px){.cl{display:block;}td{padding:10px 6px;}}
    @media (prefers-color-scheme:dark){:root{--paper:#1c1a16;--paper2:#26231d;--ink:#ece3cf;--soft:#b9ac8f;--faint:#857a5f;--red:#e5434f;--line:#3a3529;}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <span style="font-size:1.6rem" aria-hidden="true">🕊️</span>
      <div><div class="k">HOST VIEW · LIVE</div><h1>The Albatross Files — Scoreboard</h1></div>
      <div class="live"><span class="dot"></span><span id="live">connecting…</span></div>
    </div>
    <div class="meta"><span id="count">—</span><span>Ranked by score, then fastest time</span></div>
    <div id="board"><div class="empty">Loading…</div></div>

    <div class="tools">
      <button class="btn" id="toggle" type="button">Manage entries</button>
      <span class="note" style="margin:0;">View phone numbers and remove entries.</span>
    </div>

    <div id="manage">
      <div id="flash"></div>
      <p class="note">Deleting an entry also lets that person take the quiz again.
        Deletions are immediate and cannot be undone.</p>
      <div id="entries"></div>
      <div class="tools">
        <button class="btn danger" id="clear" type="button">Clear all entries</button>
      </div>
    </div>
  </div>
  <script>
    var KEY = new URLSearchParams(location.search).get('key') || '';
    var TOTAL = 10;
    function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
    function medal(r){return r===1?"🥇":r===2?"🥈":r===3?"🥉":r;}
    function paint(res){
      var board=document.getElementById('board');
      if(!res||!res.ok){
        var why=(res&&res.error)?res.error:'Could not reach the server.';
        board.innerHTML='<div class="err">'+esc(why)+'</div>';
        document.getElementById('live').textContent='not loaded';
        return;
      }
      if(res.total) TOTAL=res.total;
      document.getElementById('live').textContent='Updated '+res.updated;
      document.getElementById('count').textContent=res.count+(res.count===1?' entry':' entries');
      if(!res.players.length){board.innerHTML='<div class="empty">No submissions yet — the board fills as people finish.</div>';return;}
      var h='<table><thead><tr><th>#</th><th>Participant</th><th class="r">Score</th><th class="r">Time</th></tr></thead><tbody>';
      res.players.forEach(function(p){
        var cls=p.rank<=3?(' class="top'+p.rank+'"'):'';
        h+='<tr'+cls+'><td>'+medal(p.rank)+'</td>';
        h+='<td><span class="nm">'+esc(p.name)+'</span> <span class="cl">'+esc(p.cluster)+'</span></td>';
        h+='<td class="r"><span class="sc">'+p.score+'</span>/'+TOTAL+'</td>';
        h+='<td class="r tm">'+p.timeSec+'s</td></tr>';
      });
      h+='</tbody></table>';board.innerHTML=h;
    }
    function poll(){
      fetch('/api/leaderboard?key='+encodeURIComponent(KEY))
        .then(function(r){return r.json();})
        .then(paint)
        .catch(function(){document.getElementById('live').textContent='reconnecting…';});
    }
    poll(); setInterval(poll, 4000);

    /* ---- manage entries (host only; same key) ---- */
    var manageOpen = false;
    var manageEl = document.getElementById('manage');
    var flashEl = document.getElementById('flash');

    function flash(msg, bad){
      flashEl.innerHTML = '<div class="flash'+(bad?' bad':'')+'">'+esc(msg)+'</div>';
      setTimeout(function(){ flashEl.innerHTML=''; }, 5000);
    }

    document.getElementById('toggle').addEventListener('click', function(){
      manageOpen = !manageOpen;
      manageEl.classList.toggle('on', manageOpen);
      this.textContent = manageOpen ? 'Hide manage' : 'Manage entries';
      if (manageOpen) loadEntries();
    });

    function loadEntries(){
      fetch('/api/results?key='+encodeURIComponent(KEY))
        .then(function(r){return r.json();})
        .then(function(res){
          var box=document.getElementById('entries');
          if(!res||!res.ok){ box.innerHTML='<div class="err">'+esc((res&&res.error)||'Could not load entries.')+'</div>'; return; }
          if(!res.entries.length){ box.innerHTML='<div class="empty">No entries yet.</div>'; return; }
          var h='<table><thead><tr><th>#</th><th>Name</th><th>Phone</th><th>Cluster</th>'
              + '<th class="r">Score</th><th class="r">Time</th><th></th></tr></thead><tbody>';
          res.entries.forEach(function(e){
            h+='<tr><td>'+e.rank+'</td><td class="nm">'+esc(e.name)+'</td>'
             + '<td class="ph">'+esc(e.phone)+'</td><td class="cl">'+esc(e.cluster)+'</td>'
             + '<td class="r">'+e.score+'/'+(res.total||TOTAL)+'</td><td class="r tm">'+e.timeSec+'s</td>'
             + '<td class="r"><button class="del" data-id="'+e.id+'" data-name="'+esc(e.name)+'">Delete</button></td></tr>';
          });
          h+='</tbody></table>';
          box.innerHTML=h;
          box.querySelectorAll('.del').forEach(function(btn){
            btn.addEventListener('click', function(){
              var name=btn.getAttribute('data-name');
              if(!confirm('Delete the entry for '+name+'?\n\nThis cannot be undone, and they will be able to take the quiz again.')) return;
              btn.disabled=true; btn.textContent='…';
              post({id:Number(btn.getAttribute('data-id'))}, 'Deleted '+name+'.');
            });
          });
        })
        .catch(function(){ flash('Could not reach the server.', true); });
    }

    document.getElementById('clear').addEventListener('click', function(){
      if(!confirm('Delete EVERY entry?\n\nThis cannot be undone.')) return;
      var typed = prompt('This clears the whole scoreboard.\nType DELETE to confirm:');
      if(typed !== 'DELETE'){ flash('Cancelled — nothing was deleted.'); return; }
      post({all:true, confirm:'DELETE'}, 'All entries cleared.');
    });

    function post(body, okMsg){
      fetch('/api/delete?key='+encodeURIComponent(KEY), {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
      }).then(function(r){return r.json();})
        .then(function(res){
          if(res&&res.ok){ flash(okMsg+' ('+res.removed+' removed)'); loadEntries(); poll(); }
          else { flash((res&&res.error)||'Delete failed.', true); loadEntries(); }
        })
        .catch(function(){ flash('Could not reach the server.', true); });
    }
  </script>
</body>
</html>
